<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cora · Post-PCI Recovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0D1B2A; --ink: #0F172A; --body: #334155; --muted: #64748B; --line: #E2E8F0;
    --bg: #F4F7FB; --card: #FFFFFF; --blue: #2563EB; --blue-soft: #EFF4FF;
    --green: #059669; --green-soft: #ECFDF5; --amber: #B45309; --amber-soft: #FFFBEB;
    --red: #DC2626; --red-soft: #FEF2F2; --radius: 18px;
    --sans: 'Inter', 'PingFang HK', 'PingFang SC', 'Noto Sans TC', 'Noto Sans SC', 'Microsoft JhengHei', system-ui, sans-serif;
    --display: 'Plus Jakarta Sans', 'PingFang HK', 'PingFang SC', 'Noto Sans TC', 'Noto Sans SC', system-ui, sans-serif;
    font-size: 15px;
  }
  body.big { font-size: 18px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--body); font-family: var(--sans); line-height: 1.5; }
  h1, h2, h3, .num { font-family: var(--display); color: var(--ink); margin: 0; }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- Top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 20px; background: var(--navy); color: #fff; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--blue); display: grid; place-items: center; font-weight: 800; font-family: var(--display); }
  .brand b { font-family: var(--display); font-size: 1.05rem; }
  .brand small { display: block; color: #94A3B8; font-size: .72rem; }
  .demo-tag { font-size: .68rem; background: #F59E0B; color: #1F2937; padding: 3px 9px; border-radius: 99px; font-weight: 700; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: flex; background: #1E293B; border-radius: 12px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: #CBD5E1; padding: 6px 11px; border-radius: 9px; font-weight: 600; font-size: .8rem; white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--navy); }
  .ghost-btn { border: 1px solid #334155; background: transparent; color: #E2E8F0; padding: 6px 10px; border-radius: 9px; font-weight: 700; font-size: .8rem; }

  /* ---------- Patient stage ---------- */
  .stage { display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 18px 20px 24px; }
  .phone { width: 390px; height: min(820px, calc(100vh - var(--topbar-h, 64px) - 42px)); min-height: 560px; flex: none; position: relative; background: var(--bg); border: 10px solid #0B1220; border-radius: 48px; box-shadow: 0 30px 60px -20px rgba(13,27,42,.35); overflow: hidden; display: flex; flex-direction: column; }
  .statusbar { display: flex; justify-content: space-between; padding: 12px 26px 4px; font-size: .78rem; font-weight: 600; color: var(--ink); background: #fff; }
  .screen { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .page { display: none; padding: 14px 16px 24px; }
  .page.on { display: block; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 6px 4px 16px; }
  .tabbar button { border: 0; background: none; color: var(--muted); font-size: .7rem; font-weight: 600; display: grid; justify-items: center; gap: 2px; padding: 4px 0; }
  .tabbar button .ico { width: 22px; height: 22px; }
  .tabbar button.on { color: var(--blue); }

  /* line icons */
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ttl { display: inline-flex; align-items: center; gap: 9px; }
  .ibox { width: 30px; height: 30px; border-radius: 10px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
  .ibox.pink { background: #FDF2F8; color: #BE185D; }
  .ibox.amber { background: var(--amber-soft); color: var(--amber); }
  .ibox.green { background: var(--green-soft); color: var(--green); }
  .ibox.sm { width: 26px; height: 26px; border-radius: 8px; }
  .ibox.sm .ico { width: 15px; height: 15px; }
  .ok-ic { color: var(--green); width: 16px; height: 16px; vertical-align: -3px; margin-left: 4px; }
  .safety { display: flex; gap: 8px; align-items: flex-start; font-size: .76rem; font-weight: 600; background: var(--amber-soft); color: #92400E; border-radius: 10px; padding: 8px 10px; margin-top: 10px; }
  .safety .ico { width: 15px; height: 15px; margin-top: 1px; }
  .src-link { border: 0; background: none; padding: 0; color: var(--blue); font-size: .72rem; font-weight: 600; }
  .days { display: flex; gap: 4px; margin: 4px 0 6px; }
  .days button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 5px 0; font-size: .72rem; font-weight: 700; color: var(--muted); }
  .days button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .suggest button { border: 1px dashed #BFD0F7; background: var(--blue-soft); color: #1E40AF; border-radius: 99px; padding: 5px 10px; font-size: .74rem; font-weight: 600; }
  .q .qtext { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .q input { width: 18px; height: 18px; accent-color: var(--green); margin-top: 1px; flex: none; }
  .q.asked .qtext span { text-decoration: line-through; color: var(--muted); }
  .src-item { padding: 9px 0; border-top: 1px solid var(--line); font-size: .8rem; }
  .src-item:first-of-type { border-top: 0; }
  .src-item a { color: var(--blue); font-weight: 600; text-decoration: none; word-break: break-word; }
  .src-item .tier-t { font-size: .66rem; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .04em; }

  .annot { width: 340px; position: sticky; top: 90px; }
  .annot .mod { font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: var(--blue); text-transform: uppercase; }
  .annot h2 { font-size: 1.6rem; font-weight: 800; margin: 4px 0 10px; }
  .annot p { margin: 0 0 14px; }
  .annot h4 { font-family: var(--display); color: var(--ink); font-size: .85rem; margin: 16px 0 8px; }
  .annot ol { margin: 0; padding-left: 20px; font-size: .88rem; }
  .annot ol li { margin-bottom: 4px; }
  .need { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .need b { color: var(--ink); display: block; font-size: .85rem; margin-bottom: 2px; }
  .need span { font-size: .84rem; }

  /* ---------- Components ---------- */
  .hello { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin: 4px 2px 12px; }
  .hello h1 { font-size: 1.45rem; font-weight: 800; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hello > div:first-child { min-width: 0; }
  .hello .sub { font-size: .78rem; color: var(--muted); }
  .hello-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .icon-btns { display: flex; gap: 6px; }
  .icon-btn { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 10px; font-size: .74rem; font-weight: 700; color: var(--blue); white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--blue-soft); color: var(--blue); white-space: nowrap; }
  .chip.green { background: var(--green-soft); color: var(--green); }
  .chip.amber { background: var(--amber-soft); color: var(--amber); }
  .chip.red { background: var(--red-soft); color: var(--red); }
  .chip.gray { background: #F1F5F9; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .card h3 { font-size: .98rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .hint { font-size: .78rem; color: var(--muted); margin: -4px 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #F8FAFC; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .stat .lbl { font-size: .68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat .num { font-size: 1.3rem; font-weight: 800; }
  .stat .num small { font-size: .75rem; font-weight: 600; color: var(--muted); }
  .stat .note { font-size: .7rem; color: var(--muted); }
  .sos { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--red-soft); border: 1px solid #FECACA; color: #991B1B; border-radius: 14px; padding: 9px 12px; font-size: .76rem; margin-bottom: 12px; }
  .sos a { background: var(--red); color: #fff; text-decoration: none; font-weight: 700; padding: 5px 10px; border-radius: 9px; white-space: nowrap; }
  .btn { border: 0; background: var(--blue); color: #fff; font-weight: 700; padding: 9px 14px; border-radius: 12px; font-size: .85rem; }
  .btn.light { background: var(--blue-soft); color: var(--blue); }
  .btn.block { width: 100%; }
  .btn.big { padding: 13px 16px; font-size: .95rem; border-radius: 14px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .link { border: 0; background: none; color: var(--blue); font-weight: 600; font-size: .8rem; padding: 0; text-align: left; }
  .foot-note { font-size: .74rem; color: var(--muted); margin-top: 8px; }
  .empty { text-align: center; padding: 22px 16px; }
  .empty .big-ic { font-size: 2.4rem; }
  .empty h3 { justify-content: center; margin: 8px 0 6px; }
  .empty p { font-size: .82rem; margin: 0 0 14px; }
  .coach { background: var(--navy); color: #E2E8F0; border-radius: var(--radius); padding: 14px; margin-bottom: 12px; font-size: .84rem; }
  .coach b { color: #fff; display: block; font-family: var(--display); font-size: .98rem; margin-bottom: 4px; }

  .sym { display: flex; flex-wrap: wrap; gap: 6px; }
  .sym button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 11px; font-size: .78rem; font-weight: 600; color: var(--body); }
  .sym button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .sym button.warn { border-color: #FECACA; color: #B91C1C; }
  .sym button.warn.on { background: var(--red); border-color: var(--red); color: #fff; }
  .feedback { margin-top: 10px; font-size: .8rem; border-radius: 12px; padding: 9px 11px; }
  .feedback.ok { background: var(--green-soft); color: #065F46; }
  .feedback.amber { background: var(--amber-soft); color: #92400E; }
  .feedback.red { background: var(--red-soft); color: #991B1B; }
  .sleep-scale { display: flex; justify-content: space-between; margin-top: 4px; }
  .sleep-scale button { border: 1px solid var(--line); background: #fff; border-radius: 12px; width: 52px; height: 44px; font-size: 1.3rem; }
  .sleep-scale button.on { border-color: var(--blue); background: var(--blue-soft); }
  .ring { width: 54px; height: 54px; flex: none; }
  .med { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .med:first-child { border-top: 0; }
  .med input { width: 22px; height: 22px; accent-color: var(--green); margin-top: 2px; flex: none; }
  .med .ibox { margin-top: -2px; }
  .med .t { font-weight: 700; color: var(--ink); font-size: .85rem; }
  .med .d { font-size: .74rem; color: var(--muted); }
  .med.done .t { text-decoration: line-through; color: var(--muted); }
  .tag { font-size: .62rem; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
  .tag.w { background: var(--blue-soft); color: var(--blue); }
  .tag.c { background: #FDF2F8; color: #BE185D; }
  .rule { font-size: .74rem; background: var(--amber-soft); color: #92400E; border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
  .rule.blue { background: var(--blue-soft); color: #1E40AF; }
  .bar { height: 10px; background: #E2E8F0; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }
  .recipe { display: flex; gap: 10px; }
  .recipe .em { font-size: 1.8rem; width: 48px; height: 48px; flex: none; border-radius: 12px; background: #FFF7ED; display: grid; place-items: center; }
  .recipe b { color: var(--ink); font-size: .86rem; display: block; }
  .recipe span { font-size: .76rem; }
  .checker { display: flex; gap: 6px; }
  .checker input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font: inherit; font-size: .85rem; }
  .quick { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .quick button { border: 1px solid var(--line); background: #F8FAFC; border-radius: 8px; padding: 3px 8px; font-size: .74rem; }
  .verdict { margin-top: 10px; border-radius: 12px; padding: 10px 12px; font-size: .8rem; }
  .verdict b { display: block; font-size: .86rem; margin-bottom: 2px; }
  .verdict.red { background: var(--red-soft); color: #991B1B; }
  .verdict.amber { background: var(--amber-soft); color: #92400E; }
  .verdict.green { background: var(--green-soft); color: #065F46; }
  .verdict.gray { background: #F1F5F9; color: var(--body); }
  .target, .medrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .82rem; }
  .medrow { display: block; }
  .target:first-of-type, .medrow:first-of-type { border-top: 0; }
  .target b, .medrow b { color: var(--ink); }
  .sub-zh { color: var(--muted); font-size: .74rem; }
  .tier { font-size: .62rem; font-weight: 800; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .tier.t1 { background: var(--green-soft); color: var(--green); }
  .tier.t2 { background: var(--amber-soft); color: var(--amber); }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #CBD5E1; border-radius: 99px; transition: .2s; }
  .switch span::before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--blue); }
  .switch input:checked + span::before { transform: translateX(18px); }
  .q { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); font-size: .82rem; }
  .q:first-child { border-top: 0; }
  .q button { border: 0; background: none; color: var(--muted); font-size: 1.1rem; line-height: 1; }

  /* sheets & overlays inside phone */
  .sheet { position: absolute; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: flex-end; z-index: 8; }
  .sheet.show { display: flex; }
  .sheet .panel { background: #fff; width: 100%; max-height: 88%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 22px 20px 28px; }
  .sheet .panel h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
  .sheet .panel p { font-size: .85rem; margin: 0 0 10px; }
  .sheet .panel h4 { font-family: var(--display); color: var(--ink); font-size: .88rem; margin: 14px 0 6px; }
  .sheet .panel ol { margin: 0; padding-left: 20px; font-size: .85rem; }
  .sheet .call { display: block; text-align: center; background: var(--red); color: #fff; text-decoration: none; font-weight: 800; font-size: 1.1rem; padding: 14px; border-radius: 14px; margin: 14px 0 8px; }
  .ob { position: absolute; inset: 0; background: #fff; z-index: 6; display: flex; flex-direction: column; }
  .ob-top { display: flex; justify-content: space-between; align-items: center; padding: 44px 20px 8px; font-size: .78rem; color: var(--muted); }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 22px; height: 5px; border-radius: 9px; background: var(--line); }
  .dots i.on { background: var(--blue); }
  .ob-body { flex: 1; overflow-y: auto; padding: 8px 22px 16px; }
  .ob-body .hero { font-size: 3rem; margin: 6px 0 4px; }
  .ob-body h2 { font-size: 1.55rem; font-weight: 800; margin-bottom: 8px; line-height: 1.25; }
  .ob-body p { margin: 0 0 12px; font-size: .9rem; }
  .ob-foot { display: flex; gap: 8px; padding: 12px 20px 26px; border-top: 1px solid var(--line); }
  .ob-foot .btn { flex: 1; }
  .lang-pick { display: grid; gap: 8px; margin: 6px 0 14px; }
  .lang-pick button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; text-align: left; font-weight: 700; color: var(--ink); font-size: .95rem; }
  .lang-pick button.on { border-color: var(--blue); background: var(--blue-soft); }
  .lang-pick small { display: block; font-weight: 500; color: var(--muted); font-size: .75rem; }
  .checklist { list-style: none; padding: 0; margin: 0 0 12px; }
  .checklist li { padding: 8px 0 8px 28px; position: relative; border-top: 1px solid var(--line); font-size: .88rem; }
  .checklist li:first-child { border-top: 0; }
  .checklist li::before { content: "✓"; position: absolute; left: 4px; color: var(--green); font-weight: 800; }
  .steps { counter-reset: s; list-style: none; padding: 0; margin: 0 0 12px; }
  .steps li { counter-increment: s; position: relative; padding: 10px 0 10px 40px; border-top: 1px solid var(--line); font-size: .88rem; }
  .steps li:first-child { border-top: 0; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 9px; width: 28px; height: 28px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-weight: 800; display: grid; place-items: center; }
  .routine { display: grid; gap: 8px; }
  .routine div { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: .85rem; }
  .routine b { color: var(--ink); display: block; }
  .ok-box { background: var(--green-soft); color: #065F46; border-radius: 12px; padding: 10px 12px; font-size: .84rem; margin-top: 10px; }
  .time-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .84rem; }
  .time-row:first-child { border-top: 0; }
  .time-row input { border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; font: inherit; font-size: .85rem; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: .85rem; z-index: 50; max-width: 90vw; display: none; }
  .toast.show { display: block; }

  /* ---------- Doctor view ---------- */
  .doc { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
  .doc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: var(--blue); text-transform: uppercase; }
  .doc-head h1 { font-size: 1.8rem; font-weight: 800; margin: 2px 0 4px; }
  .doc-head .meta { font-size: .85rem; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .lbl { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .kpi .num { font-size: 1.9rem; font-weight: 800; color: var(--blue); line-height: 1.2; }
  .kpi .num small { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .kpi .delta { font-size: .78rem; font-weight: 600; color: var(--green); }
  .dgrid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; }
  .panel-d { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  .panel-d h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel-d .hint { margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td .chip { white-space: normal; }
  textarea { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: .85rem; color: var(--body); resize: vertical; }
  .legend { display: flex; gap: 14px; font-size: .75rem; color: var(--muted); font-weight: 500; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

function speak(text) {
  if (!('speechSynthesis' in window)) { toast(t('noTTS')); return; }
  const lang = { en: 'en-GB', yue: 'zh-HK', zh: 'zh-CN' }[LANG];
  const voices = speechSynthesis.getVoices();
  const norm = (s) => s.replace('_', '-').toLowerCase();
  const match = voices.find((v) => norm(v.lang) === lang.toLowerCase()) ||
    voices.find((v) => LANG === 'yue' ? /yue|zh-hk/.test(norm(v.lang)) : norm(v.lang).startsWith(lang.slice(0, 2)));
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.92;
  if (match) u.voice = match;
  else if (voices.length && LANG !== 'en') toast(t('noVoice', { l: 'English' }));
  speechSynthesis.speak(u);
}

function lineChart(labels, series, opts = {}) {
  const W = opts.w || 330, H = opts.h || 120, pad = { l: 28, r: 10, t: 14, b: 22 };
  const n = labels.length, xs = (i) => pad.l + i * (W - pad.l - pad.r) / (n - 1);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  labels.forEach((lb, i) => { svg += `<text x="${xs(i)}" y="${H - 6}" font-size="10" fill="#94A3B8" text-anchor="middle">${lb}</text>`; });
  series.forEach((s, si) => {
    const ys = (v) => pad.t + (1 - (v - s.min) / (s.max - s.min)) * (H - pad.t - pad.b);
    if (si === 0) [s.min, (s.min + s.max) / 2, s.max].forEach((g) => {
      svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${ys(g)}" y2="${ys(g)}" stroke="#EEF2F7"/><text x="${pad.l - 6}" y="${ys(g) + 3}" font-size="9" fill="#94A3B8" text-anchor="end">${Math.round(g)}</text>`;
    });
    svg += `<polyline points="${s.values.map((v, i) => `${xs(i)},${ys(v)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v, i) => {
      const last = i === (opts.sel ?? s.values.length - 1);
      svg += `<circle cx="${xs(i)}" cy="${ys(v)}" r="${last ? 4.5 : 3}" fill="${last ? s.color : '#fff'}" stroke="${s.color}" stroke-width="2"/>`;
      if (last || i === 0) svg += `<text x="${xs(i) + (i === 0 ? 8 : 0)}" y="${ys(v) - 9}" font-size="10" font-weight="700" fill="${s.color}" text-anchor="middle">${v}</text>`;
    });
  });
  return svg + '</svg>';
}
function barChart(labels, groups, opts = {}) {
  const W = opts.w || 330, H = opts.h || 120, pad = { l: 28, r: 6, t: 14, b: 22 }, max = opts.max;
  const n = labels.length, slot = (W - pad.l - pad.r) / n, bw = Math.min(22, (slot - 6) / groups.length);
  const ys = (v) => pad.t + (1 - v / max) * (H - pad.t - pad.b);
  const hi = opts.sel ?? n - 1, fmt = opts.fmt || ((v) => v);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [0, max / 2, max].forEach((g) => { svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${ys(g)}" y2="${ys(g)}" stroke="#EEF2F7"/><text x="${pad.l - 6}" y="${ys(g) + 3}" font-size="9" fill="#94A3B8" text-anchor="end">${Math.round(g)}</text>`; });
  labels.forEach((lb, i) => {
    const x0 = pad.l + i * slot + (slot - bw * groups.length - 2 * (groups.length - 1)) / 2;
    groups.forEach((g, gi) => {
      const v = g.values[i], x = x0 + gi * (bw + 2);
      svg += `<rect x="${x}" y="${ys(v)}" width="${bw}" height="${ys(0) - ys(v)}" rx="4" fill="${g.color}" opacity="${i === hi ? 1 : .35}"/>`;
      if (i === hi) svg += `<text x="${x + bw / 2}" y="${ys(v) - 4}" font-size="10" font-weight="700" fill="${g.color}" text-anchor="middle">${fmt(v)}</text>`;
    });
    svg += `<text x="${pad.l + i * slot + slot / 2}" y="${H - 6}" font-size="10" fill="${i === hi ? 'var(--ink)' : '#94A3B8'}" font-weight="${i === hi ? 700 : 400}" text-anchor="middle">${lb}</text>`;
    if (opts.onSel) svg += `<rect x="${pad.l + i * slot}" y="0" width="${slot}" height="${H}" fill="transparent" style="cursor:pointer" onclick="${opts.onSel}(${i})"/>`;
  });
  return svg + '</svg>';
}
function thermalChart() {
  const W = 330, H = 92, x = (h) => 28 + (h / 8) * (W - 38), y = (tp) => 10 + (1 - (tp - 32) / 9) * (H - 30);
  const pts = [[0, 33.5], [0.5, 37], [0.9, 37], [1.6, 34.5], [8, 34.5]].map(([h, tp]) => [x(h), y(tp)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let k = 1; k < pts.length; k++) {
    const [x0, y0] = pts[k - 1], [x1, y1] = pts[k], mx = (x0 + x1) / 2;
    d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`;   // flat tangents: smooth, no overshoot
  }
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  s += `<line x1="28" x2="${W - 10}" y1="${y(40)}" y2="${y(40)}" stroke="var(--red)" stroke-dasharray="4 3"/>`;
  s += `<text x="${W - 10}" y="${y(40) - 4}" font-size="9" fill="var(--red)" text-anchor="end" font-weight="700">${t('cutoff')}</text>`;
  s += `<path d="${d}" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>`;
  s += `<text x="${x(0.7)}" y="${y(37) - 6}" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">37.0°</text>`;
  s += `<text x="${x(4.5)}" y="${y(34.5) - 6}" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">34.5° ${t('neutral')}</text>`;
  ['22:00', '00:00', '02:00', '04:00', '06:00'].forEach((lb, i) => { s += `<text x="${x(i * 2)}" y="${H - 4}" font-size="9" fill="#94A3B8" text-anchor="middle">${lb}</text>`; });
  return s + '</svg>';
}

/* ================= Actions ================= */
function go(tab) { TAB = tab; $('screen').scrollTop = 0; refresh(); }
function setView(v) { VIEW = v; window.scrollTo(0, 0); refresh(); }
function setMode(m) { MODE = m; symMsg = null; herbResult = null; refresh(); }
function setLang(l) { LANG = l; save(); refresh(); }
function toggleBig() { document.body.classList.toggle('big'); save(); refresh(); }
function resetNew() { S.new = makeNew(); symMsg = null; herbResult = null; TAB = 'today'; refresh(); }

function toggleSym(id) {
  const s = st(), x = SYMPTOMS.find((y) => y.id === id);
  if (id === 'none') s.sym = s.sym.includes('none') ? [] : ['none'];
  else {
    s.sym = s.sym.filter((y) => y !== 'none');
    s.sym = s.sym.includes(id) ? s.sym.filter((y) => y !== id) : [...s.sym, id];
  }
  symMsg = null;
  if (s.sym.includes(id)) {
    if (x.level === 'red') {
      symMsg = { cls: 'red', key: 'msg_red' };
      addLog(T['sym_' + id], T.resp_red, 'red');
      openSos('red');
    } else {
      symMsg = { cls: x.level === 'amber' ? 'amber' : 'ok', key: 'msg_' + id };
      if (id !== 'none') addLog(T['sym_' + id], id === 'bleed' ? T.resp_bleed : x.level === 'amber' ? T.resp_amber : T.resp_log, x.level === 'amber' ? 'amber' : 'log');
      if (id === 'bleed' || id === 'dizzy') openSos('amber', id);
    }
  }
  refresh();
}
function addLog(what, resp, level) {
  const s = st();
  s.log = s.log.filter((l) => !(l.today && l.what[0] === what[0]));
  s.log.push({ today: true, what, resp, level });
}
function openSos(kind = 'red', id) {
  const red = kind === 'red';
  $('sosPanel').innerHTML = `<h2 style="color:${red ? 'var(--red)' : 'var(--amber)'}">${red ? t('sosTitle') : t('sym_' + id)}</h2>` +
    (red ? `<p>${t('sosP1')}</p><p><b>${t('sosP2')}</b></p>` : `<p>${t('msg_' + id)}</p>`) +
    `<a class="call" href="tel:999">${t('call999')}</a><button class="btn light block" onclick="$('sosSheet').classList.remove('show')">${t('imOk')}</button>`;
  $('sosSheet').classList.add('show');
}
function openSources(ids) {
  const list = ids ? ids.split(',') : Object.keys(SOURCES);
  $('helpPanel').innerHTML = `<div class="eyebrow">${t('sources')}</div><h2>${t('sources')}</h2><p>${t('srcIntro')}</p>` +
    list.map((k) => { const x = SOURCES[k]; return `<div class="src-item"><div class="tier-t">${k} · ${pick(x.tier)}</div><a href="${x.url}" target="_blank" rel="noopener">${esc(x.title)}</a><div style="font-size:.74rem;color:var(--muted)">${esc(x.pub)}</div></div>`; }).join('') +
    (list.includes('S1') ? `<div class="safety" style="margin-top:12px">${ic('alert')}<span>${t('recipeNote')}</span></div>` : '') +
    `<button class="btn light block" style="margin-top:12px" onclick="closeHelp()">${t('close')}</button>`;
  $('helpSheet').classList.add('show');
}
function selNight(i) { NIGHT_SEL = i; refresh(); }
function toggleAsked(i) {
  const x = st().questions[i];
  st().questions[i] = { q: x && x.q !== undefined ? x.q : x, asked: !(x && x.asked) };
  refresh();
}
function addSuggest(k) { st().questions.push({ q: SUGGEST[k], asked: false }); refresh(); }
function checkHerb(val) {
  const input = $('herbInput');
  const raw = (val ?? (input ? input.value : '')).trim();
  if (!raw) { herbResult = null; refresh(); return; }
  const q = raw.toLowerCase();
  const hit = HERBS.find((h) => h.keys.some((k) => q.includes(k.toLowerCase()) || (q.length >= 2 && k.toLowerCase().includes(q))));
  herbResult = { q: raw, hit };
  if (hit && hit.level !== 'green') {
    const what = [0, 1, 2].map((i) => T.herbLogWhat[i].replace('{q}', raw));
    const resp = [0, 1, 2].map((i) => T.herbLogResp[i].replace('{v}', hit.title[i]));
    st().log.push({ today: true, what, resp, level: 'log' });
  }
  refresh();
}
function addQ() {
  const v = $('qInput').value.trim();
  if (!v) return;
  st().questions.push({ q: v, asked: false });
  refresh();
}
function connectEh() {
  if (busy.eh) return;
  busy.eh = true; refresh();
  setTimeout(() => { busy.eh = false; st().eh = true; if (st().ob === 99) toast('✓ ' + t('ob1Done', { date: fmtDate(pciDate()) })); refresh(); }, 1300);
}
function pairSoma() {
  if (busy.soma) return;
  busy.soma = true; refresh();
  setTimeout(() => { busy.soma = false; st().soma = true; if (st().ob === 99) toast('✓ ' + t('ob3Done')); refresh(); }, 1500);
}
function speakPage() {
  const s = st();
  let text = '';
  if (TAB === 'today') {
    text = (MODE === 'new' && !s.eh ? t('greetNew') : t('greet')) + '. ';
    if (s.eh) {
      const left = MEDS.map((m, i) => i).filter((i) => !s.meds[i]).sort((a, b) => s.times[a].localeCompare(s.times[b]));
      text += left.length ? t('speakMeds', { n: left.length, list: left.map((i) => s.times[i] + ' ' + pick(MEDS[i].name)).join(LANG === 'en' ? ', ' : '，') }) : t('speakMedsDone');
    } else text += t('noMeds');
    text += ' ' + t('howToday');
  } else if (TAB === 'night') {
    text = !s.soma ? t('noSomaBody') : MODE === 'demo' ? t('speakNight') : t('firstNightBody');
  } else if (TAB === 'plan') {
    text = s.eh ? t('myMeds') + '. ' + MED_INFO.map((m) => pick(m.name) + '. ' + pick(m.how)).join('. ') : t('planEmptyB');
  } else {
    text = s.eh ? t('speakVisit', { date: fmtAppt(apptDate()), n: s.questions.length }) : t('noAppt');
  }
  speak(text.replace(/·/g, ','));
}

/* ================= Doctor ================= */
function renderDoctor() {
  if (MODE === 'new') {
    $('doc').innerHTML = `<div class="doc-empty"><div style="font-size:2.6rem">📄</div><h2 style="margin:8px 0">${t('dEmptyT')}</h2><p>${t('dEmptyB')}</p>
      <div style="font-weight:700;color:var(--ink)">${t('dEmptyWill')}</div><ul><li>${t('dE1')}</li><li>${t('dE2')}</li><li>${t('dE3')}</li><li>${t('dE4')}</li></ul><br>
      <button class="btn" onclick="setMode('demo')">${t('dEmptyDemo')}</button></div>`;
    return;
  }
  const s = st();
  const wk = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => LANG === 'en' ? 'W' + n : t('wk', { n }));
  const cls = { red: 'red', amber: 'amber', log: 'gray' };
  const flags = s.log.filter((l) => l.level === 'red' || l.level === 'amber').length;
  const todayItems = s.log.filter((l) => l.today).map((l) => pick(l.what)).join(LANG === 'en' ? ', ' : '、');
  const note = {
    en: `Adherence: MMAS-8 improved from 6.75 to 8/8. Western medicines 99% and Tongxinluo 97% of doses ticked in weeks 7–8. Tongxinluo reminder moved to 19:30 after two missed evening doses in week 6.
Sleep: PSQI improved from 11 to 5. Soma in-bed time stable (~8 h), 12 turns/night.
Nocturnal resting HR (Soma Tier 2, trend only): 72 → 61 bpm over 8 weeks; mean valid signal 91%.
Symptoms: palpitations week 3 (resolved after nurse call); low mood week 5 (rehab nurse follow-up).
Herb safety: asked about adding danshen (week 2); advised to avoid. No reported use of interacting herbs or grapefruit.`,
    yue: `服藥依從性：MMAS-8由6.75升至8/8。第7–8星期西藥99%、通心絡97%劑量已確認服用。第6星期兩次漏服晚間通心絡後，提示時間改為19:30。
睡眠：PSQI由11改善至5。Soma在床時間穩定（約8小時），每晚轉身12次。
夜間靜息心率（Soma第2級，只供趨勢參考）：8星期內由72降至61 bpm；平均有效訊號91%。
症狀：第3星期心悸（護士致電後已緩解）；第5星期情緒低落（復康護士跟進）。
草藥安全：第2星期查詢湯中加丹參，已建議避免。未有報告使用相沖草藥或西柚。`,
    zh: `服药依从性：MMAS-8由6.75升至8/8。第7–8周西药99%、通心络97%剂量已确认服用。第6周两次漏服晚间通心络后，提醒时间改为19:30。
睡眠：PSQI由11改善至5。Soma在床时间稳定（约8小时），每晚翻身12次。
夜间静息心率（Soma第2级，仅供趋势参考）：8周内由72降至61 bpm；平均有效信号91%。
症状：第3周心悸（护士致电后已缓解）；第5周情绪低落（康复护士跟进）。
草药安全：第2周询问汤里加丹参，已建议避免。未报告使用相冲草药或西柚。`,
  }[LANG] + (todayItems ? '\n' + t('todayCheck', { x: todayItems }) : '') + '\n' + ['[Clinician to complete assessment and plan.]', '［由醫生填寫評估及計劃。］', '［由医生填写评估及计划。］'][LI[LANG]];

  $('doc').innerHTML = `
    <div class="doc-head">
      <div><div class="eyebrow">${t('dEyebrow')}</div><h1>${t('dTitle')}</h1><div class="meta">${t('dMeta', { p: fmtDate(pciDate()) + ' – ' + fmtDate(today()) })}</div></div>
      <div class="row no-print"><span class="chip gray">${t('dReview')}</span><button class="btn" onclick="window.print()">${t('dPrint')}</button></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">${t('k1')}</div><div class="num">8.0 <small>/ 8</small></div><div class="delta">${t('d1')}</div></div>
      <div class="kpi"><div class="lbl">${t('k2')}</div><div class="num">96<small>%</small></div><div class="delta">${t('d2')}</div></div>
      <div class="kpi"><div class="lbl">${t('k3')}</div><div class="num">5</div><div class="delta">${t('d3')}</div></div>
      <div class="kpi"><div class="lbl">${t('k4')}</div><div class="num">61 <small>bpm</small></div><div class="delta">${t('d4')}</div></div>
      <div class="kpi"><div class="lbl">${t('k5')}</div><div class="num">92<small>%</small></div><div class="delta" style="color:var(--muted)">${t('d5')}</div></div>
    </div>
    <div class="dgrid">
      <div>
        <div class="panel-d"><h3>${t('dTrend')} <span class="legend"><span><i style="background:var(--blue)"></i>${t('lgHR')}</span><span><i style="background:#F59E0B"></i>PSQI</span></span></h3><div class="hint">${t('dTrendHint')}</div>
          ${lineChart(wk, [{ values: WEEK_HR, color: 'var(--blue)', min: 55, max: 76 }, { values: WEEK_PSQI, color: '#F59E0B', min: 0, max: 21 }], { w: 560, h: 190 })}</div>
        <div class="panel-d"><h3>${t('dAdh')} <span class="legend"><span><i style="background:var(--blue)"></i>${t('tagW')}</span><span><i style="background:#DB2777"></i>${['Tongxinluo', '通心絡', '通心络'][LI[LANG]]}</span></span></h3><div class="hint">${t('dAdhHint')}</div>
          ${barChart(wk, [{ values: WEEK_ADH_W, color: 'var(--blue)' }, { values: WEEK_ADH_C, color: '#DB2777' }], { w: 560, h: 170, max: 100 })}</div>
      </div>
      <div>
        <div class="panel-d"><h3>${t('dLog')} <span class="chip amber">${t('flags', { n: flags })}</span></h3><div class="hint">${t('dLogHint')}</div>
          <table><thead><tr><th>${t('thWhen')}</th><th>${t('thRep')}</th><th>${t('thResp')}</th></tr></thead><tbody>
          ${s.log.map((l) => `<tr><td><b>${l.today ? t('whenToday') : t('wk', { n: l.wk })}</b></td><td>${esc(pick(l.what))}</td><td><span class="chip ${cls[l.level]}">${esc(pick(l.resp))}</span></td></tr>`).join('')}
          </tbody></table></div>
        <div class="panel-d"><h3>${t('dQ')}</h3><ul style="margin:6px 0 0;padding-left:18px;font-size:.85rem">${s.questions.length ? s.questions.map((q) => `<li>${esc(qText(q))}</li>`).join('') : `<li>${t('none')}</li>`}</ul></div>
      </div>
    </div>
    <div class="panel-d"><h3>${t('dNote')} <span class="chip gray">${t('dEdit')}</span></h3><div class="hint">${t('dNoteHint')}</div>
      <textarea>${esc(note)}</textarea><div class="foot-note">${t('dFoot')}</div></div>`;
}

/* ================= Render loop ================= */
function refresh() {
  renderChrome();
  $('patientView').hidden = VIEW !== 'patient';
  $('doctorView').hidden = VIEW !== 'doctor';
  if (VIEW === 'patient') {
    renderToday(); renderNight(); renderPlan(); renderVisit();
    document.querySelectorAll('.page').forEach((p) => p.classList.toggle('on', p.id === 'p-' + TAB));
    renderOb(); renderAnnot();
  } else {
    renderDoctor();
  }
  save();
}

(function init() {
  const prefs = load('cora_prefs');
  if (prefs) { if (prefs.lang && LI[prefs.lang] !== undefined) LANG = prefs.lang; if (prefs.big) document.body.classList.add('big'); }
  const qs = new URLSearchParams(location.search);
  if (qs.get('lang') && LI[qs.get('lang')] !== undefined) LANG = qs.get('lang');
  if (qs.get('mode') === 'new') MODE = 'new';
  if (['plan', 'night', 'today', 'visit'].includes(qs.get('tab'))) TAB = qs.get('tab');
  if (qs.get('view') === 'doctor') VIEW = 'doctor';
  if (qs.get('shot')) document.body.classList.add('shot');   // screenshot mode: hide top bar and side panel
  refresh();
  window.addEventListener('resize', () => document.documentElement.style.setProperty('--topbar-h', $('topbar').offsetHeight + 'px'));
})();
</script>
</body>
</html>
